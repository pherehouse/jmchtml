name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm pack --dry-run
      - name: Validate SKILL.md frontmatter
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('skills/jmchtml/SKILL.md', 'utf8');
          if (!/^---\r?\n[\s\S]*?\r?\n---\r?\n/.test(text)) throw new Error('Invalid YAML frontmatter block');
          if (!/^name:\s*["']?jmchtml["']?\s*$/m.test(text)) throw new Error('Missing name: jmchtml');
          if (!/^description:\s*.+$/m.test(text)) throw new Error('Missing description');
          NODE
